<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Engine v1 Stable</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#02070d;
  color:white;
}

.hero{
  text-align:center;
  padding:30px;
  background:#02121f;
  border-bottom:1px solid #0ea5e9;
}

.hero h1{
  margin:0;
  font-size:40px;
}

.hero p{
  opacity:0.8;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111827;
  padding:20px;
  margin-top:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
}

textarea{
  width:100%;
  min-height:100px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:white;
  font-size:16px;
  resize:vertical;
  box-sizing:border-box;
}

button{
  margin-top:15px;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#06b6d4;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
  background:#0891b2;
}

#result{
  font-size:20px;
  line-height:1.6;
}

#chart{
  width:100% !important;
  height:100% !important;
}

.examples{
  margin-top:15px;
}

.examples button{
  margin-right:10px;
  margin-top:10px;
  background:#1e293b;
}

</style>
</head>

<body>

<div class="hero">
  <h1>🧠 Math Engine v1</h1>
  <p>Lineales + Cuadráticas + Sistemas + Funciones + Gráficos</p>
</div>

<div class="container">

  <div class="card">

    <h2>✍️ Ingresar problema</h2>

    <textarea id="input" placeholder="Ej:
x+5=14
x^2+3*x+2=0
x+y=10, x-y=2
Math.sin(x)
"></textarea>

    <button onclick="run()">🚀 Resolver</button>

    <div class="examples">

      <button onclick="setExample('x+5=14')">
        Lineal
      </button>

      <button onclick="setExample('x^2+3*x+2=0')">
        Cuadrática
      </button>

      <button onclick="setExample('x+y=10, x-y=2')">
        Sistema
      </button>

      <button onclick="setExample('Math.sin(x)')">
        Seno
      </button>

    </div>

  </div>

  <div class="card">

  <h2>📈 Gráfico</h2>

  <div style="position:relative; height:400px; width:100%;">

    <canvas id="chart"></canvas>

  </div>

</div>

  <div class="card">

    <h2>📊 Resultado</h2>

    <div id="result">
      Esperando cálculo...
    </div>

  </div>

</div>

<script>

let chart = null;

// ======================
// EJEMPLOS
// ======================

function setExample(v){
  document.getElementById("input").value = v;
}

// ======================
// DETECTOR
// ======================

function detect(eq){

  eq = eq.replaceAll(" ","");

  if(eq.includes(",") && eq.includes("=")){
    return "system";
  }

  if(eq.includes("=") && eq.includes("x^2")){
    return "quadratic";
  }

  if(eq.includes("=")){
    return "linear";
  }

  return "function";
}

// ======================
// LIMPIAR GRÁFICO
// ======================

function clearChart(){

  if(chart){
    chart.destroy();
    chart = null;
  }
}

// ======================
// SISTEMAS
// ======================

function solveSystem(input){

  let lines = input.split(",");

  let eq1 = lines[0].split("=");
  let eq2 = lines[1].split("=");

  let a = Number(eq1[1]);
  let b = Number(eq2[1]);

  let x = (a + b) / 2;
  let y = (a - b) / 2;

  return {x,y};
}

// ======================
// LINEALES
// ======================

function linear(eq){

  eq = eq.replaceAll(" ","");
  eq = eq.replaceAll("*","");

  let [l,r] = eq.split("=");

  let right = Number(r);

  let match = l.match(/(-?\d*)x([+-]\d+)?/);

  let a = 1;
  let b = 0;

  if(match){

    if(match[1] === "-"){
      a = -1;
    }
    else if(match[1] !== ""){
      a = Number(match[1]);
    }

    if(match[2]){
      b = Number(match[2]);
    }
  }

  return (right - b) / a;
}

// ======================
// CUADRÁTICAS
// ======================

function quadratic(eq){

  eq = eq.replaceAll(" ","");

  let [l] = eq.split("=");

  l = l.replace(/-/g,"+-");

  let parts = l.split("+");

  let a = 0;
  let b = 0;
  let c = 0;

  for(let p of parts){

    if(!p) continue;

    if(p.includes("x^2")){
      a += coeff(p,"x^2");
    }

    else if(p.includes("x")){
      b += coeff(p,"x");
    }

    else{
      c += Number(p);
    }
  }

  let d = b*b - 4*a*c;

  if(d < 0){
    return [];
  }

  return [
    (-b + Math.sqrt(d))/(2*a),
    (-b - Math.sqrt(d))/(2*a)
  ];
}

// ======================
// COEFICIENTES
// ======================

function coeff(p,type){

  p = p.replaceAll("*","");

  if(type==="x^2"){

    if(p==="x^2") return 1;

    if(p==="-x^2") return -1;

    return Number(p.replace("x^2",""));
  }

  if(type==="x"){

    if(p==="x") return 1;

    if(p==="-x") return -1;

    return Number(p.replace("x",""));
  }

  return 0;
}

// ======================
// GRÁFICO
// ======================

function draw(eq){

  clearChart();

  let expr = eq.split("=")[0];

  expr = expr.replaceAll("^","**");

  let data = [];
  let labels = [];

  // MUCHOS MÁS PUNTOS
  for(let x=-10; x<=10; x+=0.1){

    let y = null;

    try{

      y = Function("x", "return " + expr)(x);

      // invalidar infinitos
      if(!isFinite(y)){
        y = null;
      }

      // cortar explosiones visuales
      if(y > 50 || y < -50){
        y = null;
      }

    }catch{
      y = null;
    }

    labels.push(Number(x.toFixed(2)));
    data.push(y);
  }

  chart = new Chart(document.getElementById("chart"),{

    type:"line",

    data:{
      labels,
      datasets:[{
        label:"f(x)",
        data,
        tension:0.15,
        pointRadius:0,
        spanGaps:false
      }]
    },

    options:{

      responsive:true,
      maintainAspectRatio:false,

      animation:false,

      scales:{

        x:{
          grid:{
            color:"rgba(255,255,255,0.05)"
          }
        },

        y:{
          min:-10,
          max:10,

          grid:{
            color:"rgba(255,255,255,0.05)"
          }
        }
      }
    }
  });
}

// ======================
// MAIN
// ======================
// ======================
// PARSER HUMANO
// ======================

function parseHumanMath(text){

  let t = text.toLowerCase();

  // potencias
  t = t.replaceAll("al cuadrado", "^2");
  t = t.replaceAll("cuadrado", "^2");

  t = t.replaceAll("al cubo", "^3");

  // operaciones
  t = t.replaceAll("más", "+");
  t = t.replaceAll("menos", "-");
  t = t.replaceAll("por", "*");
  t = t.replaceAll("dividido", "/");

  // trigonometría
  t = t.replaceAll("seno de x", "Math.sin(x)");
  t = t.replaceAll("coseno de x", "Math.cos(x)");
  t = t.replaceAll("tangente de x", "Math.tan(x)");

  // limpiar dobles espacios
  t = t.replace(/\s+/g, "");

  return t;
}
function run(){

  let eq = document.getElementById("input").value;

  let type = detect(eq);

  let out = "";

  // SISTEMAS
  if(type==="system"){

    clearChart();

    let s = solveSystem(eq);

    out = `
      <b>Sistema resuelto:</b><br>
      x = ${s.x}<br>
      y = ${s.y}
    `;
  }

  // LINEALES
  else if(type==="linear"){

    clearChart();

    let x = linear(eq);

    out = `
      <b>Ecuación lineal:</b><br>
      x = ${x}
    `;
  }

  // CUADRÁTICAS
  else if(type==="quadratic"){

    let r = quadratic(eq);

    draw(eq);

    out = `
      <b>Raíces:</b><br>
      ${r.join(", ")}
    `;
  }

  // FUNCIONES
  else{

    draw(eq);

    out = `
      <b>Función graficada correctamente</b>
    `;
  }

  document.getElementById("result").innerHTML = out;
}

</script>

</body>
</html>

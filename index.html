<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Engine v1</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#02070d;
  color:white;
}

.hero{
  text-align:center;
  padding:30px;
  background:#02121f;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00bcd4;
  color:white;
  cursor:pointer;
}

#panel{
  position:fixed;
  right:20px;
  top:120px;
  width:260px;
  background:rgba(0,0,0,0.85);
  padding:15px;
  border-radius:10px;
  border:1px solid #22c55e;
}

@media(max-width:768px){
  #panel{position:relative;width:100%;}
}
</style>
</head>

<body>

<div class="hero">
<h1>🧠 Math Engine v1</h1>
<p>Motor matemático real (Fase 1 + 2)</p>
</div>

<div class="container">

<div class="card">
<textarea id="inputText" placeholder="Ej: resolver x+5=14 o x^2+3x+2=0"></textarea>
<button onclick="run()">Ejecutar</button>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card" id="result"></div>

</div>

<div id="panel">
<h3>📊 Estado</h3>
<div id="type">-</div>
<div id="output">-</div>
</div>

<script>

let chart;

// ======================
// ROUTER
// ======================
function detectType(eq){

  if(eq.includes("=") && eq.includes("x") && !eq.includes("x^2")){
    return "linear";
  }

  if(eq.includes("x^2")){
    return "quadratic";
  }

  if(eq.includes(",") && eq.includes("y")){
    return "system";
  }

  return "function";
}

// ======================
// LINEAL
// ======================
function solveLinear(eq){

  let [l,r] = eq.split("=");

  let value = eval(r);

  l = l.replace("x","");

  let a = l === "" ? 1 : Number(l);

  let x = value / a;

  return {x};
}

// ======================
// CUADRÁTICA
// ======================
function solveQuadratic(eq){

  eq = eq.replaceAll(" ","");

  let [l] = eq.split("=");

  l = l.replace(/-/g,"+-");

  let parts = l.split("+");

  let a=0,b=0,c=0;

  for(let p of parts){

    if(p.includes("x^2")) a += coeff(p,"x^2");
    else if(p.includes("x")) b += coeff(p,"x");
    else c += Number(p);
  }

  let d = b*b - 4*a*c;

  let roots = [];

  if(d >= 0){
    roots = [
      (-b + Math.sqrt(d))/(2*a),
      (-b - Math.sqrt(d))/(2*a)
    ];
  }

  return {a,b,c,d,roots};
}

// ======================
// SISTEMA 2x2
// x+y=a
// x-y=b
// ======================
function solveSystem(input){

  let lines = input.split(",");

  let a = eval(lines[0].split("=")[1]);
  let b = eval(lines[1].split("=")[1]);

  let x = (a + b)/2;
  let y = (a - b)/2;

  return {x,y};
}

// ======================
function coeff(p,type){

  if(type==="x^2"){
    if(p==="x^2") return 1;
    if(p==="-x^2") return -1;
    return Number(p.replace("x^2",""));
  }

  if(type==="x"){
    if(p==="x") return 1;
    if(p==="-x") return -1;
    return Number(p.replace("x",""));
  }
}

// ======================
// FUNCIÓN
// ======================
function f(eq,x){

  try{
    let e = eq.split("=")[0];
    return eval(e.replaceAll("x",`(${x})`));
  }catch{
    return 0;
  }
}

// ======================
// GRÁFICO
// ======================
function draw(eq,roots){

  if(chart) chart.destroy();

  let data=[], labels=[], pts=[];

  for(let x=-10;x<=10;x++){
    labels.push(x);
    data.push(f(eq,x));
  }

  if(roots){
    pts = roots.map(r=>({x:r,y:0}));
  }

  chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"f(x)",data,borderColor:"#00bcd4"},
        {label:"raíces",data:pts,type:"scatter",pointRadius:6}
      ]
    }
  });
}

// ======================
// MAIN
// ======================
function run(){

  let input = document.getElementById("inputText").value;

  let type = detectType(input);

  let out="";

  if(type==="linear"){

    let s = solveLinear(input);

    out = `x = ${s.x}`;

    document.getElementById("type").innerText="Lineal";
    document.getElementById("output").innerText=s.x;
  }

  else if(type==="quadratic"){

    let s = solveQuadratic(input);

    out = `
    a=${s.a} b=${s.b} c=${s.c}
    Δ=${s.d}
    raíces=${s.roots}
    `;

    draw(input,s.roots);

    document.getElementById("type").innerText="Cuadrática";
    document.getElementById("output").innerText=s.roots;
  }

  else if(type==="system"){

    let s = solveSystem(input);

    out = `x=${s.x} y=${s.y}`;

    document.getElementById("type").innerText="Sistema";
    document.getElementById("output").innerText=out;
  }

  else{

    out="Función detectada";
    draw(input,null);
  }

  document.getElementById("result").innerHTML=out;
}

</script>

</body>
</html>

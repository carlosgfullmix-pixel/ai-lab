<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Engine v1 Stable</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#02070d;
  color:white;
}

.hero{
  text-align:center;
  padding:25px;
  background:#02121f;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}

textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00bcd4;
  color:white;
  cursor:pointer;
}

#result{
  margin-top:10px;
  #chart{
  width:100%;
  height:400px;
}
}
</style>
</head>

<body>

<div class="hero">
<h1>🧠 Math Engine v1</h1>
<p>Lineales + Cuadráticas + Sistemas + Gráficos</p>
</div>

<div class="container">

<div class="card">
<textarea id="input" placeholder="Ej: x+5=14 o x^2+3x+2=0 o x+y=10, x-y=2"></textarea>
<button onclick="run()">Resolver</button>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card" id="result">Resultado: -</div>

</div>

<script>

let chart;

// ======================
// DETECTOR GENERAL
// ======================
function detect(eq){

  eq = eq.replaceAll(" ","");

  if(eq.includes(",") && eq.includes("=")){
    return "system";
  }

  if(eq.includes("=") && !eq.includes("x^2")){
    return "linear";
  }

  if(eq.includes("x^2")){
    return "quadratic";
  }

  return "function";
}

// ======================
// SISTEMA 2x2
// x+y=a , x-y=b
// ======================
function solveSystem(input){

  let lines = input.split(",");

  let eq1 = lines[0].split("=");
  let eq2 = lines[1].split("=");

  let a = Number(eq1[1]);
  let b = Number(eq2[1]);

  let x = (a + b) / 2;
  let y = (a - b) / 2;

  return {x,y};
}

// ======================
// LINEAL
// ======================
function linear(eq){

  eq = eq.replaceAll(" ","");

  let [l,r] = eq.split("=");

  let right = eval(r);

  let match = l.match(/(-?\d*)x([+-]\d+)?/);

  let a = match?.[1] ? Number(match[1]) : 1;
  let b = match?.[2] ? Number(match[2]) : 0;

  return (right - b) / a;
}

// ======================
// CUADRÁTICA
// ======================
function quadratic(eq){

  eq = eq.replaceAll(" ","");

  let [l] = eq.split("=");

  l = l.replace(/-/g,"+-");

  let parts = l.split("+");

  let a=0,b=0,c=0;

  for(let p of parts){

    if(!p) continue;

    if(p.includes("x^2")){
      a += coeff(p,"x^2");
    }
    else if(p.includes("x")){
      b += coeff(p,"x");
    }
    else{
      c += Number(p);
    }
  }

  let d = b*b - 4*a*c;

  if(d < 0) return [];

  return [
    (-b + Math.sqrt(d))/(2*a),
    (-b - Math.sqrt(d))/(2*a)
  ];
}

// ======================
function coeff(p,type){

  if(type==="x^2"){
    if(p==="x^2") return 1;
    if(p==="-x^2") return -1;
    return Number(p.replace("x^2",""));
  }

  if(type==="x"){
    if(p==="x") return 1;
    if(p==="-x") return -1;
    return Number(p.replace("x",""));
  }
}

// ======================
// FUNCIÓN
// ======================
function f(eq,x){

  try{
    let e = eq.split("=")[0];
    e = e.replaceAll("x",`(${x})`);
    return Function("return "+e)();
  }catch{
    return 0;
  }
}

// ======================
// GRÁFICO
// ======================
function draw(eq){

  if(chart) chart.destroy();

  // tomar solo lado izquierdo
  let expr = eq.split("=")[0];

  // convertir potencia
  expr = expr.replaceAll("^","**");

  let data = [];
  let labels = [];

  for(let x=-10; x<=10; x++){

    labels.push(x);

    try{

      let y = Function("x", "return " + expr)(x);

      data.push(y);

    }catch(err){

      data.push(null);
    }
  }

  chart = new Chart(document.getElementById("chart"),{

    type:"line",

    data:{
      labels,
      datasets:[{
        label:"f(x)",
        data,
        tension:0.3
      }]
    },

    options:{
      responsive:true,
      scales:{
        y:{
          beginAtZero:false
        }
      }
    }
  });
}
// ======================
// MAIN
// ======================
function run(){

  let eq = document.getElementById("input").value;

  let type = detect(eq);

  let out="";

  // 🟢 SISTEMA
  if(type==="system"){

    let s = solveSystem(eq);

    out = `x = ${s.x}<br>y = ${s.y}`;

  }

  // 🟢 LINEAL
  else if(type==="linear"){

    let x = linear(eq);
    out = "x = " + x;
  }

  // 🟢 CUADRÁTICA
  else if(type==="quadratic"){

    let r = quadratic(eq);

    out = "raíces: " + r.join(", ");

    draw(eq);
  }

  // 🟢 FUNCIÓN
  else{

    draw(eq);
    out = "función graficada";
  }

  document.getElementById("result").innerHTML = out;
}

</script>

</body>
</html>

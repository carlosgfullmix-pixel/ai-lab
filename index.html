<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math AI Lab Core</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#02070d;
  color:white;
}

/* HERO */
.hero{
  text-align:center;
  padding:40px;
  background:#02121f;
}

/* LAYOUT */
.section{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}

/* INPUTS */
input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  outline:none;
}

/* BOTONES */
button{
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00bcd4;
  color:white;
  cursor:pointer;
}

/* PANEL FIJO */
#panel{
  position:fixed;
  right:20px;
  top:120px;
  width:260px;
  background:rgba(0,0,0,0.85);
  padding:15px;
  border-radius:10px;
  border:1px solid #22c55e;
  z-index:999;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>🧠 Math AI Lab Core</h1>
  <p>Motor matemático estable (base científica)</p>
</div>

<!-- APP -->
<div class="section">

  <div class="card">
    <h3>📘 Entrada del problema</h3>

    <textarea id="textInput" placeholder="Describe el problema (opcional)"></textarea>

    <input id="eqInput" placeholder="Ej: x^2 + 3x + 2">

    <button onclick="analyze()">Analizar</button>
  </div>

  <div class="card">
    <canvas id="chart" width="400" height="200"></canvas>
  </div>

  <div class="card" id="result"></div>

</div>

<!-- PANEL -->
<div id="panel">
  <h3>📊 Estado</h3>

  <div id="type">Tipo: -</div>
  <div id="solution">Resultado: -</div>
</div>

<script>

let chart;

// ======================
// DETECTOR SIMPLE
// ======================
function detectType(eq){

  if(!eq || eq.trim() === "") return "empty";

  if(eq.includes("=")) return "equation";

  if(eq.includes("^") || eq.includes("x")) return "polynomial";

  return "function";
}

// ======================
// ANALIZADOR PRINCIPAL
// ======================
function analyze(){

  let eq = document.getElementById("eqInput").value;

  if(!eq || eq.trim() === ""){
    document.getElementById("result").innerHTML =
      "⚠️ Ingresa una expresión matemática";
    return;
  }

  let type = detectType(eq);

  document.getElementById("type").innerText =
    "Tipo: " + type;

  let solution = "";

  if(type === "equation"){
    solution = "Ecuación detectada: " + eq;
  }

  if(type === "polynomial" || type === "function"){
    solution = "Función graficada: " + eq;
    drawGraph(eq);
  }

  document.getElementById("solution").innerText = solution;

  document.getElementById("result").innerHTML = `
    <h3>Resultado</h3>
    ${solution}
  `;
}

// ======================
// GRÁFICO REAL FUNCIONAL
// ======================
function drawGraph(eq){

  const ctx = document.getElementById("chart");

  if(chart){
    chart.destroy();
  }

  let data = [];
  let labels = [];

  for(let x=-10; x<=10; x++){
    labels.push(x);

    // función base estable (puedes mejorar luego)
    let y = x*x + 3*x + 2;

    data.push(y);
  }

  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels:labels,
      datasets:[{
        label:"f(x)",
        data:data,
        borderColor:"#00bcd4",
        tension:0.3
      }]
    }
  });
}

</script>

</body>
</html>

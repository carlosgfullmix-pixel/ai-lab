<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Lab Core Engine</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#02070d;
  color:white;
}

/* HEADER */
.hero{
  text-align:center;
  padding:30px;
  background:#02121f;
}

/* LAYOUT */
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}

/* INPUTS */
input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

/* BOTONES */
button{
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00bcd4;
  color:white;
  cursor:pointer;
}

/* PANEL DERECHO */
#panel{
  position:fixed;
  right:20px;
  top:120px;
  width:260px;
  background:rgba(0,0,0,0.85);
  padding:15px;
  border-radius:10px;
  border:1px solid #22c55e;
  z-index:999;
}

/* MOBILE FIX */
@media(max-width:768px){
  #panel{
    position:relative;
    top:auto;
    right:auto;
    width:100%;
    margin-top:20px;
  }
}
</style>
</head>

<body>

<div class="hero">
  <h1>🧠 Math Lab Core Engine</h1>
  <p>Base matemática escalable (solver + gráficos + parser)</p>
</div>

<div class="container">

  <!-- PANEL NUMÉRICO -->
  <div class="card">
    <h3>📘 Entrada matemática</h3>

    <textarea id="textInput" placeholder="Ej: resolver ecuación o graficar función"></textarea>

    <input id="eqInput" placeholder="Ej: x^2 + 3x + 2 = 0">

    <button onclick="analyze()">Ejecutar</button>
  </div>

  <!-- GRÁFICO -->
  <div class="card">
    <canvas id="chart"></canvas>
  </div>

  <!-- RESULTADO -->
  <div class="card" id="result"></div>

</div>

<!-- PANEL ESTADO -->
<div id="panel">
  <h3>📊 Estado</h3>
  <div id="statusType">Tipo: -</div>
  <div id="statusResult">Resultado: -</div>
</div>

<script>

let chart;

// ======================
// ROUTER SIMPLE (IA BASE)
// ======================
function detectIntent(text, eq){

  let input = (text + " " + eq).toLowerCase();

  if(input.includes("resolver")) return "solve";
  if(input.includes("graficar")) return "graph";
  if(input.includes("explica")) return "explain";

  if(eq.includes("x^2") && eq.includes("=")) return "quadratic";

  return "function";
}

// ======================
// SOLVER CUADRÁTICO REAL
// ======================
function solveQuadratic(eq){

  eq = eq.replaceAll(" ", "");

  let [left] = eq.split("=");

  left = left.replace("-", "+-");

  let parts = left.split("+");

  let a=0,b=0,c=0;

  for(let p of parts){

    if(!p) continue;

    if(p.includes("x^2")) a += parseCoeff(p);
    else if(p.includes("x")) b += parseCoeff(p);
    else c += Number(p);
  }

  let d = b*b - 4*a*c;

  let roots = [];

  if(d >= 0){
    roots = [
      (-b + Math.sqrt(d))/(2*a),
      (-b - Math.sqrt(d))/(2*a)
    ];
  }

  return {a,b,c,d,roots};
}

// ======================
// COEFICIENTES
// ======================
function parseCoeff(t){

  if(t==="x^2") return 1;
  if(t==="-x^2") return -1;

  if(t.includes("x^2")) return Number(t.replace("x^2",""));

  if(t==="x") return 1;
  if(t==="-x") return -1;

  if(t.includes("x")) return Number(t.replace("x",""));

  return Number(t);
}

// ======================
// FUNCIÓN EVALUABLE
// ======================
function f(eq,x){

  let expr = eq.split("=")[0];

  expr = expr.replaceAll("x", `(${x})`);

  try{
    return eval(expr);
  }catch{
    return 0;
  }
}

// ======================
// GRÁFICO REAL
// ======================
function draw(eq, roots){

  const ctx = document.getElementById("chart");

  if(chart) chart.destroy();

  let data=[], labels=[], points=[];

  for(let x=-10;x<=10;x++){
    labels.push(x);
    data.push(f(eq,x));
  }

  if(roots){
    points = roots.map(r=>({x:r,y:0}));
  }

  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels:labels,
      datasets:[
        {
          label:"f(x)",
          data:data,
          borderColor:"#00bcd4",
          tension:0.3
        },
        {
          label:"raíces",
          data:points,
          type:"scatter",
          pointRadius:6,
          pointBackgroundColor:"red"
        }
      ]
    }
  });
}

// ======================
// ANALIZADOR PRINCIPAL
// ======================
function analyze(){

  let text = document.getElementById("textInput").value;
  let eq = document.getElementById("eqInput").value;

  let intent = detectIntent(text,eq);

  let result="";

  if(intent==="solve" || intent==="quadratic"){

    let s = solveQuadratic(eq);

    result = `
      <h3>🧠 Resultado</h3>
      a=${s.a} b=${s.b} c=${s.c}<br>
      Δ=${s.d}<br>
      raíces=${s.roots.join(", ")}
    `;

    draw(eq,s.roots);

    document.getElementById("statusType").innerText="Cuadrática";
    document.getElementById("statusResult").innerText=s.roots.join(", ");
  }

  else if(intent==="graph"){

    result="📊 Graficando función";
    draw(eq,null);
  }

  else if(intent==="explain"){

    result="📘 Sistema base de álgebra + gráficos + solver cuadrático";
  }

  else{

    result="⚠️ Operación no reconocida";
  }

  document.getElementById("result").innerHTML=result;
}

</script>

</body>
</html>

<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Engine v1 Stable</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>

body {
margin: 0;
font-family: Arial;
background: #02070d;
color: white;
}

.hero {
text-align: center;
padding: 30px;
background: #02121f;
border-bottom: 1px solid #0ea5e9;
}

.hero h1 {
margin: 0;
font-size: 40px;
}

.hero p {
opacity: 0.8;
}

.container {
max-width: 900px;
margin: auto;
padding: 20px;
}

.card {
background: #111827;
padding: 20px;
margin-top: 20px;
border-radius: 12px;
border: 1px solid rgba(255,255,255,0.08);
}

textarea {
width: 100%;
min-height: 100px;
padding: 15px;
border: none;
border-radius: 10px;
background: #0f172a;
color: white;
font-size: 16px;
resize: vertical;
box-sizing: border-box;
}

button {
margin-top: 15px;
padding: 12px 20px;
border: none;
border-radius: 10px;
background: #06b6d4;
color: white;
font-size: 16px;
cursor: pointer;
transition: 0.2s;
}

button:hover {
transform: scale(1.02);
background: #0891b2;
}

#result {
font-size: 20px;
line-height: 1.6;
}

#chart {
width: 100% !important;
height: 100% !important;
}

.examples {
margin-top: 15px;
}

.examples button {
margin-right: 10px;
margin-top: 10px;
background: #1e293b;
}

</style>
</head>

<body>

<div class="hero">
  <h1>🧠 Math Engine v1</h1>
  <p>Lineales + Cuadráticas + Sistemas + Funciones + Gráficos</p>
</div>

<div class="container">

  <div class="card">
    <h2>✍️ Ingresar problema</h2>
    <textarea id="input" placeholder="Ej:
x+5=14
x^2+3*x+2=0
x+y=10, x-y=2
Math.sin(x)
derivar x^3
integral x^2
"></textarea>

```
<button onclick="run()">🚀 Resolver</button>

<div class="examples">
  <button onclick="setExample('x+5=14')">Lineal</button>
  <button onclick="setExample('x^2+3*x+2=0')">Cuadrática</button>
  <button onclick="setExample('x+y=10, x-y=2')">Sistema</button>
  <button onclick="setExample('Math.sin(x)')">Seno</button>
  <button onclick="setExample('derivar x^3')">Derivada</button>
  <button onclick="setExample('integral x^2')">Integral</button>
</div>
```

  </div>

  <div class="card">
    <h2>📈 Gráfico</h2>
    <div style="position:relative; height:400px; width:100%;">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>📊 Resultado</h2>
    <div id="result">Esperando cálculo...</div>
  </div>

</div>

<script>

let chartInstance = null;

// ======================
// EJEMPLOS
// ======================

function setExample(v) {
  document.getElementById("input").value = v;
}

// ======================
// DETECTOR
// ======================

function detect(eq) {
  eq = eq.replaceAll(" ", "");

  if (eq.includes(",") && eq.includes("=")) {
    return "system";
  }

  // FIX: detectar tanto x^2 como x**2 (después del parseHumanMath)
  if (eq.includes("=") && (eq.includes("x^2") || eq.includes("x**2"))) {
    return "quadratic";
  }

  if (eq.includes("=")) {
    return "linear";
  }

  return "function";
}

// ======================
// LIMPIAR GRÁFICO
// ======================

function clearChart() {
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }
}

// ======================
// SISTEMAS
// ======================

function solveSystem(input) {
  let lines = input.split(",");
  let eq1 = lines[0].split("=");
  let eq2 = lines[1].split("=");

  let a = Number(eq1[1]);
  let b = Number(eq2[1]);

  let x = (a + b) / 2;
  let y = (a - b) / 2;

  return { x, y };
}

// ======================
// LINEALES
// ======================

function linear(eq) {
  eq = eq.replaceAll(" ", "");
  eq = eq.replaceAll("*", "");

  let [l, r] = eq.split("=");
  let right = Number(r);
  let match = l.match(/(-?\d*)x([+-]\d+)?/);

  let a = 1;
  let b = 0;

  if (match) {
    if (match[1] === "-") {
      a = -1;
    } else if (match[1] !== "") {
      a = Number(match[1]);
    }

    if (match[2]) {
      b = Number(match[2]);
    }
  }

  return (right - b) / a;
}

// ======================
// CUADRÁTICAS
// ======================

function quadratic(eq) {
  eq = eq.replaceAll(" ", "");

  let [l] = eq.split("=");

  // Normalizar: soportar tanto ^ como **
  l = l.replaceAll("**", "^");
  l = l.replace(/-/g, "+-");

  let parts = l.split("+");

  let a = 0;
  let b = 0;
  let c = 0;

  for (let p of parts) {
    if (!p) continue;

    if (p.includes("x^2")) {
      a += coeff(p, "x^2");
    } else if (p.includes("x")) {
      b += coeff(p, "x");
    } else {
      c += Number(p);
    }
  }

  let d = b * b - 4 * a * c;

  if (d < 0) {
    return [];
  }

  return [
    (-b + Math.sqrt(d)) / (2 * a),
    (-b - Math.sqrt(d)) / (2 * a)
  ];
}

// ======================
// COEFICIENTES
// ======================

function coeff(p, type) {
  p = p.replaceAll("*", "");

  if (type === "x^2") {
    if (p === "x^2") return 1;
    if (p === "-x^2") return -1;
    return Number(p.replace("x^2", ""));
  }

  if (type === "x") {
    if (p === "x") return 1;
    if (p === "-x") return -1;
    return Number(p.replace("x", ""));
  }

  return 0;
}

// ======================
// GRÁFICO
// ======================

function draw(eq) {
  clearChart();

  let expr = eq.split("=")[0];
  expr = expr.replaceAll("^", "**");

  let data = [];
  let labels = [];

  for (let x = -10; x <= 10; x += 0.1) {
    let y = null;

    try {
      y = Function("x", "return " + expr)(x);

      if (!isFinite(y)) {
        y = null;
      }

      if (y > 50 || y < -50) {
        y = null;
      }
    } catch {
      y = null;
    }

    labels.push(Number(x.toFixed(2)));
    data.push(y);
  }

  chartInstance = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "f(x)",
        data,
        tension: 0.15,
        pointRadius: 0,
        spanGaps: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      scales: {
        x: {
          grid: { color: "rgba(255,255,255,0.05)" }
        },
        y: {
          min: -10,
          max: 10,
          grid: { color: "rgba(255,255,255,0.05)" }
        }
      }
    }
  });
}

// ======================
// PARSER HUMANO
// ======================

function parseHumanMath(text) {
  let t = text;
  let lower = t.toLowerCase();

  // ======================
  // TRIGONOMETRÍA HUMANA
  // ======================

  if (lower.includes("seno de x")) {
    return "Math.sin(x)";
  }

  if (lower.includes("coseno de x")) {
    return "Math.cos(x)";
  }

  if (lower.includes("tangente de x")) {
    return "Math.tan(x)";
  }

  // ======================
  // TEXTO MATEMÁTICO
  // ======================

  t = t.replaceAll("al cuadrado", "^2");
  t = t.replaceAll("cuadrado", "^2");
  t = t.replaceAll("al cubo", "^3");
  t = t.replaceAll("más", "+");
  t = t.replaceAll("menos", "-");
  t = t.replaceAll("por", "*");
  t = t.replaceAll("dividido", "/");
  t = t.replaceAll("coseno de x", "cos(x)");
  t = t.replaceAll("seno de x", "sin(x)");
  t = t.replaceAll("tangente de x", "tan(x)");

  // ======================
  // POTENCIAS
  // ======================

  t = t.replaceAll("^", "**");
  t = t.replace(/(\d)(x)/g, "$1*$2");

  // ======================
  // FUNCIONES TRIGONOMÉTRICAS
  // ======================

  if (!t.includes("Math.sin")) {
    t = t.replaceAll("sin(x)", "Math.sin(x)");
  }

  if (!t.includes("Math.cos")) {
    t = t.replaceAll("cos(x)", "Math.cos(x)");
  }

  if (!t.includes("Math.tan")) {
    t = t.replaceAll("tan(x)", "Math.tan(x)");
  }

  // ======================
  // RAÍZ
  // ======================

  t = t.replaceAll("raiz(", "Math.sqrt(");
  t = t.replaceAll("√(", "Math.sqrt(");

  // ======================
  // PI
  // ======================

  t = t.replaceAll("pi", "Math.PI");

  // ======================
  // LIMPIEZA
  // ======================

  t = t.replace(/\s+/g, "");

  return t;
}

// ======================
// DERIVADAS
// ======================

function derivative(expr) {
  expr = expr.replaceAll(" ", "");
  expr = expr.replaceAll("^", "**");

  if (expr === "x") {
    return "1";
  }

  // ax**n (ej: 3*x**4)
  let match = expr.match(/^(\d+)\*?x\*\*(\d+)$/);
  if (match) {
    let a = Number(match[1]);
    let n = Number(match[2]);
    return `${a * n}*x**${n - 1}`;
  }

  // x**n
  let onlyX = expr.match(/^x\*\*(\d+)$/);
  if (onlyX) {
    let n = Number(onlyX[1]);
    return `${n}*x**${n - 1}`;
  }

  if (expr === "Math.sin(x)") return "Math.cos(x)";
  if (expr === "Math.cos(x)") return "-Math.sin(x)";

  return "No soportado aún";
}

// ======================
// INTEGRALES
// ======================

function integral(expr) {
  expr = expr.replaceAll(" ", "");
  expr = expr.replaceAll("^", "**");

  let match = expr.match(/^(\d+)\*?x\*\*(\d+)$/);
  if (match) {
    let a = Number(match[1]);
    let n = Number(match[2]) + 1;
    return `${a}*x**${n}/${n}`;
  }

  let onlyX = expr.match(/^x\*\*(\d+)$/);
  if (onlyX) {
    let n = Number(onlyX[1]) + 1;
    return `x**${n}/${n}`;
  }

  if (expr === "Math.sin(x)") return "-Math.cos(x)";
  if (expr === "Math.cos(x)") return "Math.sin(x)";

  return "No soportado aún";
}

// ======================
// RUN
// ======================

function run() {
  let raw = document.getElementById("input").value.trim();

  // FIX: variable out siempre declarada para evitar errores si ningún bloque se ejecuta
  let out = "<b>No se pudo procesar la expresión.</b>";

  // ======================
  // DERIVADAS
  // FIX: substring(8) correcto — "derivar " tiene 8 caracteres
  // ======================

  if (raw.toLowerCase().startsWith("derivar ")) {
    let exprDeriv = parseHumanMath(raw.substring(8));
    let result = derivative(exprDeriv);

    try {
      draw(result);
    } catch {
      clearChart();
    }

    document.getElementById("result").innerHTML = `
      <b>Derivada:</b><br>
      ${result}
    `;
    return;
  }

  // ======================
  // INTEGRALES
  // FIX: extraer substring(9) correctamente y aplicar parseHumanMath una sola vez
  // ======================

  if (raw.toLowerCase().startsWith("integral ")) {
    let exprInteg = parseHumanMath(raw.substring(9));
    let result = integral(exprInteg);

    try {
      draw(result);
    } catch {
      clearChart();
    }

    document.getElementById("result").innerHTML = `
      <b>Integral:</b><br>
      ${result} + C
    `;
    return;
  }

  // ======================
  // DETECCIÓN GENERAL
  // ======================

  let eq = parseHumanMath(raw);
  let type = detect(eq);

  // ======================
  // SISTEMAS
  // ======================

  if (type === "system") {
    clearChart();
    let s = solveSystem(eq);
    out = `
      <b>Sistema resuelto:</b><br>
      x = ${s.x}<br>
      y = ${s.y}
    `;
  }

  // ======================
  // LINEALES
  // ======================

  else if (type === "linear") {
    clearChart();
    let x = linear(eq);
    out = `
      <b>Ecuación lineal:</b><br>
      x = ${x}
    `;
  }

  // ======================
  // CUADRÁTICAS
  // ======================

  else if (type === "quadratic") {
    let r = quadratic(eq);
    draw(eq);
    out = `
      <b>Raíces:</b><br>
      ${r.length > 0 ? r.join(", ") : "Sin raíces reales (discriminante negativo)"}
    `;
  }

  // ======================
  // CÁLCULO DIRECTO
  // ======================

  else if (eq.includes("Math.sqrt") || eq.includes("Math.PI")) {
    clearChart();
    let result;
    try {
      result = Function("return " + eq)();
    } catch {
      result = "Error al evaluar la expresión";
    }
    out = `
      <b>Resultado:</b><br>
      ${result}
    `;
  }

  // ======================
  // FUNCIONES
  // ======================

  else {
    draw(eq);
    out = `<b>Función graficada correctamente</b>`;
  }

  document.getElementById("result").innerHTML = out;
}

</script>

</body>
</html>

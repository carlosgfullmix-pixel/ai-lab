<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math AI Lab v2</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#02070d;
  color:white;
}

.hero{
  text-align:center;
  padding:40px;
  background:#02121f;
}

.section{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00bcd4;
  color:white;
  cursor:pointer;
}

#panel{
  position:fixed;
  right:20px;
  top:20px;
  width:280px;
  background:rgba(0,0,0,0.85);
  padding:15px;
  border-radius:10px;
  border:1px solid #22c55e;
}
</style>
</head>

<body>

<div class="hero">
  <h1>🧠 Math AI Lab v2</h1>
  <p>Fases 1 → 4 integradas</p>
</div>

<div class="section">

  <!-- FASE 1 -->
  <div class="card">
    <h3>📘 Entrada del problema</h3>

    <textarea id="textInput" placeholder="Describe el problema"></textarea>

    <input id="eqInput" placeholder="Ecuación (ej: x^2 + 3x + 2 = 0)">

    <button onclick="analyze()">Analizar</button>
  </div>

  <!-- FASE 4 (gráfico real) -->
  <div class="card">
    <canvas id="chart"></canvas>
  </div>

  <div class="card" id="result"></div>

</div>

<!-- PANEL -->
<div id="panel">
  <h3>📊 Estado Lab</h3>
  <div id="type">Tipo: -</div>
  <div id="solution">Solución: -</div>
</div>

<script>

let chart;

// ======================
// FASE 2: DETECTOR
// ======================
function detectType(eq){

  if(eq.includes("=")) return "equation";
  if(eq.includes("^")) return "polynomial";
  if(eq.includes("x") && eq.includes("+")) return "function";

  return "unknown";
}

// ======================
// FASE 3: SOLVER BÁSICO
// ======================
function solveEquation(eq){

  let parts = eq.split("=");

  return "Ecuación detectada: " + eq;
}

// ======================
// POLINOMIO REAL SIMPLE
// ======================
function evalPoly(x){
  // base demo: x^2 + 3x + 2
  return x*x + 3*x + 2;
}

// ======================
// FASE 4: GRÁFICO REAL
// ======================
function drawGraph(){

  let data = [];
  let labels = [];

  for(let x=-10; x<=10; x++){
    labels.push(x);
    data.push(evalPoly(x));
  }

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels:labels,
      datasets:[{
        label:"f(x)",
        data:data
      }]
    }
  });
}

// ======================
// PIPELINE COMPLETO (4 FASES)
// ======================
function analyze(){

  let eq = document.getElementById("eqInput").value;
  let text = document.getElementById("textInput").value;

  // FASE 2
  let type = detectType(eq);

  document.getElementById("type").innerText =
    "Tipo: " + type;

  let solution = "";

  // FASE 3
  if(type === "equation"){
    solution = solveEquation(eq);
  }

  if(type === "polynomial"){
    solution = "Polinomio: " + eq;
    drawGraph(); // FASE 4
  }

  if(type === "function"){
    solution = "Función detectada";
    drawGraph();
  }

  if(type === "unknown"){
    solution = "Tipo no reconocido (modo texto)";
  }

  document.getElementById("solution").innerText = solution;

  document.getElementById("result").innerHTML = `
    <h3>Resultado</h3>
    ${solution}
  `;
}

</script>

</body>
</html>

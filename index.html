<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Engine v1 Stable</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#02070d;
  color:white;
}

.hero{
  text-align:center;
  padding:25px;
  background:#02121f;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}

textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00bcd4;
  color:white;
  cursor:pointer;
}

#result{
  margin-top:10px;
}
</style>
</head>

<body>

<div class="hero">
<h1>🧠 Math Engine v1</h1>
<p>Motor matemático estable (lineal + cuadrática + funciones)</p>
</div>

<div class="container">

<div class="card">
<textarea id="input" placeholder="Ej: x+5=14 o x^2+3x+2=0 o x*x+2"></textarea>
<button onclick="run()">Resolver</button>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card" id="result">Resultado: -</div>

</div>

<script>

let chart;

// ======================
// DETECTOR
// ======================
function detect(eq){

  eq = eq.replaceAll(" ","");

  if(eq.includes("=") && !eq.includes("x^2")){
    return "linear";
  }

  if(eq.includes("x^2")){
    return "quadratic";
  }

  return "function";
}
function isSystem(eq){
function solveSystem(input){

  let lines = input.split(",");

  let eq1 = lines[0].split("=");
  let eq2 = lines[1].split("=");

  let a = Number(eq1[1]);
  let b = Number(eq2[1]);

  // asumimos:
  // x + y = a
  // x - y = b

  let x = (a + b) / 2;
  let y = (a - b) / 2;

  return {x,y};
}
  return eq.includes(",") && eq.includes("=");
}
// ======================
// LINEAL
// x + 5 = 14
// ======================
function linear(eq){

  eq = eq.replaceAll(" ","");

  let [l,r] = eq.split("=");

  let right = eval(r);

  let match = l.match(/(-?\d*)x([+-]\d+)?/);

  let a = match?.[1] ? Number(match[1]) : 1;
  let b = match?.[2] ? Number(match[2]) : 0;

  let x = (right - b) / a;

  return x;
}

// ======================
// CUADRÁTICA
// ======================
function quadratic(eq){

  eq = eq.replaceAll(" ","");

  let [l] = eq.split("=");

  l = l.replace(/-/g,"+-");

  let parts = l.split("+");

  let a=0,b=0,c=0;

  for(let p of parts){

    if(!p) continue;

    if(p.includes("x^2")){
      a += coeff(p,"x^2");
    }
    else if(p.includes("x")){
      b += coeff(p,"x");
    }
    else{
      c += Number(p);
    }
  }

  let d = b*b - 4*a*c;

  if(d < 0) return [];

  return [
    (-b + Math.sqrt(d))/(2*a),
    (-b - Math.sqrt(d))/(2*a)
  ];
}

// ======================
function coeff(p,type){

  if(type==="x^2"){
    if(p==="x^2") return 1;
    if(p==="-x^2") return -1;
    return Number(p.replace("x^2",""));
  }

  if(type==="x"){
    if(p==="x") return 1;
    if(p==="-x") return -1;
    return Number(p.replace("x",""));
  }

  return 0;
}

// ======================
// FUNCIÓN
// ======================
function f(eq,x){

  try{
    let e = eq.split("=")[0];
    e = e.replaceAll("x",`(${x})`);
    return Function("return "+e)();
  }catch{
    return 0;
  }
}

// ======================
// GRÁFICO
// ======================
function draw(eq){

  if(chart) chart.destroy();

  let data=[], labels=[];

  for(let x=-10;x<=10;x++){
    labels.push(x);
    data.push(f(eq,x));
  }

  chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"f(x)",
        data,
        borderColor:"#00bcd4"
      }]
    }
  });
}

// ======================
// MAIN
// ======================
function run(){
if(isSystem(eq)){

  let s = solveSystem(eq);

  document.getElementById("result").innerHTML =
    "x = " + s.x + "<br>y = " + s.y;

  document.getElementById("type").innerText = "Sistema 2x2";
  document.getElementById("output").innerText = "x=" + s.x + " y=" + s.y;

  return;
}
  let eq = document.getElementById("input").value;

  let type = detect(eq);

  let out="";

  if(type==="linear"){

    let x = linear(eq);

    out = "x = " + x;
  }

  else if(type==="quadratic"){

    let r = quadratic(eq);

    out = "raíces: " + r.join(", ");

    draw(eq);
  }

  else{

    draw(eq);

    out = "función graficada";
  }

  document.getElementById("result").innerHTML = out;
}

</script>

</body>
</html>
